name: Gerar DocuSeal.exe (Apenas Windows)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Ruby 3.3, Node 20 e Python 3.12
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências e compilar frontend
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          RAILS_ENV: "production"
          SECRET_KEY_BASE: "build_secret_key_1234567890"
        run: |
          corepack enable
          bundle config set --local without "development test"
          bundle install
          yarn install --ignore-engines
          bundle exec rails assets:precompile

      - name: Empacotar aplicativo desktop nativo (DocuSeal.exe)
        shell: pwsh
        run: |
          pip install pywebview pyinstaller
          New-Item -ItemType Directory -Force -Path "stage/docuseal_app" | Out-Null
          $itens = Get-ChildItem -Path . -Exclude @("stage", ".git", ".github", "docuseal_desktop.py")
          Copy-Item -Path $itens -Destination "stage/docuseal_app" -Recurse -Force

          $rubyRoot = (Get-Command ruby).Source | Split-Path | Split-Path
          Copy-Item -Path $rubyRoot -Destination "stage/ruby_runtime" -Recurse -Force

          pyinstaller --noconfirm --onefile --windowed `
            --add-data "stage/docuseal_app;docuseal_app" `
            --add-data "stage/ruby_runtime;ruby_runtime" `
            --name DocuSeal docuseal_desktop.py

      - name: Publicar DocuSeal.exe
        uses: actions/upload-artifact@v4
        with:
          name: DocuSeal-Windows-EXE
          path: dist/DocuSeal.exe